<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Criar Conta | Academia</title>
    <!-- 
        Paleta: Amarelo 60% · Laranja 30% · Preto 10%
        Imagem de fundo diferente da home
    -->
    <style>
        :root {
            --yellow: #FFC107;
            --yellow-light: #FFD54F;
            --orange: #F57C00;
            --orange-dark: #E06B00;
            --black: #1E1E1E;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(245, 124, 0, 0.25);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--black); /* fallback */
            color: var(--black);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Imagem de fundo (diferente da home) */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            background: url('https://images.unsplash.com/photo-1571902943202-507ec2618e8f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80') center/cover no-repeat;
        }

        /* Overlay com as cores da marca (mais transparente para ver a imagem) */
        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,193,7,0.45) 0%, rgba(245,124,0,0.35) 100%);
            z-index: -1;
            backdrop-filter: blur(2px);
        }

        /* Container principal do formulário */
        .register-card {
            width: 100%;
            max-width: 800px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 3rem;
            padding: 2.8rem 2.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--glass-border);
            animation: slideUp 0.8s ease;
            margin: 2rem 1rem;
            position: relative;
            z-index: 1;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cabeçalho com logo e nome */
        .form-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .logo-placeholder {
            width: 55px;
            height: 55px;
            background: var(--black);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            border: 2px dashed var(--orange);
            color: var(--yellow);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .brand-name {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--black);
            background: rgba(255,255,255,0.4);
            padding: 0.3rem 1.4rem;
            border-radius: 14px;
            border: 2px dashed var(--black);
            text-transform: uppercase;
            backdrop-filter: blur(8px);
        }

        .title {
            font-size: 2.3rem;
            font-weight: 900;
            color: var(--black);
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #2c2c2c;
            font-weight: 500;
            margin-top: 0.4rem;
            font-size: 1rem;
            opacity: 0.85;
        }

        /* Grid do formulário */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.8rem 2rem;
        }

        .span-2 {
            grid-column: span 2;
        }

        /* Grupos de campo */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--black);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        label .emoji {
            font-size: 1.1rem;
        }

        input, select, textarea {
            padding: 0.9rem 1.2rem;
            border-radius: 16px;
            border: 2px solid rgba(30, 30, 30, 0.15);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition);
            outline: none;
            color: var(--black);
            font-weight: 500;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--orange);
            box-shadow: 0 0 0 4px rgba(245, 124, 0, 0.2);
            background: rgba(255, 255, 255, 0.9);
        }

        textarea {
            resize: vertical;
            min-height: 85px;
        }

        /* Checkboxes estilizados */
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 0.2rem;
        }

        .checkbox-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(5px);
            padding: 0.6rem 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
            font-weight: 600;
            font-size: 0.9rem;
            user-select: none;
        }

        .checkbox-pill:hover {
            background: rgba(255,255,255,0.85);
            border-color: var(--orange);
        }

        .checkbox-pill input[type="checkbox"] {
            accent-color: var(--orange);
            width: 17px;
            height: 17px;
            margin: 0;
        }

        /* Select personalizado */
        select {
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%23F57C00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
            background-repeat: no-repeat;
            background-position: right 1.2rem center;
            background-size: 1.2rem;
        }

        /* Botão de envio */
        .btn-submit {
            background: var(--orange);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 25px rgba(245, 124, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            margin-top: 0.8rem;
        }

        .btn-submit:hover {
            background: var(--orange-dark);
            transform: translateY(-3px);
            box-shadow: 0 18px 35px rgba(245, 124, 0, 0.65);
        }

        /* Link de voltar */
        .back-link {
            display: inline-block;
            margin-top: 1.8rem;
            text-align: center;
            color: var(--black);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s;
            font-size: 0.95rem;
            backdrop-filter: blur(4px);
            background: rgba(255,255,255,0.3);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
        }

        .back-link:hover {
            color: var(--orange-dark);
            background: rgba(255,255,255,0.6);
        }

        /* Responsivo */
        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .span-2 {
                grid-column: span 1;
            }
            .register-card {
                padding: 2rem 1.3rem;
                border-radius: 2rem;
            }
            .checkbox-group {
                flex-direction: column;
                gap: 0.5rem;
            }
            .brand-name {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <!-- Fundo com imagem diferente da home -->
    <div class="bg-image"></div>
    <div class="overlay"></div>

    <!-- Cartão de cadastro -->
    <div class="register-card">
        <div class="form-header">
            <div class="brand-row">
                <div class="logo-placeholder" title="Logo da academia">🏋️</div>
                <div class="brand-name">NOME DA ACADEMIA</div>
            </div>
            <h1 class="title">Criar sua conta</h1>
            <p class="subtitle">Preencha os dados e comece sua jornada hoje mesmo</p>
        </div>

        <form class="form-grid" action="#" method="post">
            <!-- DADOS PESSOAIS -->
            <div class="input-group">
                <label><span class="emoji">👤</span> Nome completo</label>
                <input type="text" name="nome" placeholder="Seu nome completo" required>
            </div>

            <div class="input-group">
                <label><span class="emoji">📧</span> E-mail (Gmail)</label>
                <input type="email" name="email" placeholder="exemplo@gmail.com" required>
            </div>

            <div class="input-group">
                <label><span class="emoji">📞</span> Telefone</label>
                <input type="tel" name="telefone" placeholder="(11) 99999-9999" required>
            </div>

            <div class="input-group">
                <label><span class="emoji">🎂</span> Data de nascimento</label>
                <input type="date" name="nascimento" required>
            </div>

            <!-- SAÚDE (ocupa linha inteira) -->
            <div class="input-group span-2">
                <label><span class="emoji">❤️</span> Informações de saúde</label>
                <textarea name="saude" placeholder="Condições médicas, lesões, alergias ou outras observações importantes..."></textarea>
            </div>

            <!-- EXERCÍCIOS PREFERIDOS -->
            <div class="input-group span-2">
                <label><span class="emoji">🏆</span> Exercícios de preferência</label>
                <div class="checkbox-group">
                    <label class="checkbox-pill">
                        <input type="checkbox" name="exercicios" value="musculacao"> Musculação
                    </label>
                    <label class="checkbox-pill">
                        <input type="checkbox" name="exercicios" value="cardio"> Cardio
                    </label>
                    <label class="checkbox-pill">
                        <input type="checkbox" name="exercicios" value="funcional"> Funcional
                    </label>
                    <label class="checkbox-pill">
                        <input type="checkbox" name="exercicios" value="yoga"> Yoga / Pilates
                    </label>
                    <label class="checkbox-pill">
                        <input type="checkbox" name="exercicios" value="lutas"> Lutas
                    </label>
                    <label class="checkbox-pill">
                        <input type="checkbox" name="exercicios" value="natacao"> Natação
                    </label>
                </div>
            </div>

            <!-- PLANO -->
            <div class="input-group span-2">
                <label><span class="emoji">💳</span> Plano escolhido</label>
                <select name="plano" required>
                    <option value="" disabled selected>Selecione seu plano</option>
                    <option value="basico">Plano Básico – Acesso livre</option>
                    <option value="premium">Plano Premium – + aulas exclusivas</option>
                    <option value="vip">Plano VIP – Personal trainer incluso</option>
                    <option value="teste">Plano Experimental (7 dias grátis)</option>
                </select>
            </div>

            <!-- BOTÃO -->
            <div class="span-2">
                <button type="submit" class="btn-submit">
                    ✅ Finalizar Cadastro
                </button>
            </div>
        </form>

        <div style="text-align: center;">
            <a href="index.html" class="back-link">← Voltar para a página inicial</a>
        </div>
    </div>
</body>
</html>
