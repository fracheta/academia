<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Entrar | Academia</title>
    <!-- 
        Paleta: Amarelo 60% · Laranja 30% · Preto 10%
        Mesmo estilo da tela de cadastro (10.html)
    -->
    <style>
        :root {
            --yellow: #FFC107;
            --orange: #F57C00;
            --orange-dark: #E06B00;
            --black: #1E1E1E;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(245, 124, 0, 0.25);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--black);
            color: var(--black);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Imagem de fundo (mesma do cadastro) */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            background: url('https://images.unsplash.com/photo-1571902943202-507ec2618e8f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80') center/cover no-repeat;
        }

        /* Overlay com cores da marca */
        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,193,7,0.45) 0%, rgba(245,124,0,0.35) 100%);
            z-index: -1;
            backdrop-filter: blur(2px);
        }

        /* Cartão de login */
        .login-card {
            width: 100%;
            max-width: 450px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 3rem;
            padding: 2.8rem 2.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--glass-border);
            animation: slideUp 0.8s ease;
            margin: 2rem 1rem;
            position: relative;
            z-index: 1;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cabeçalho */
        .form-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .logo-placeholder {
            width: 55px;
            height: 55px;
            background: var(--black);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            border: 2px dashed var(--orange);
            color: var(--yellow);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .brand-name {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--black);
            background: rgba(255,255,255,0.4);
            padding: 0.3rem 1.4rem;
            border-radius: 14px;
            border: 2px dashed var(--black);
            text-transform: uppercase;
            backdrop-filter: blur(8px);
        }

        .title {
            font-size: 2.3rem;
            font-weight: 900;
            color: var(--black);
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #2c2c2c;
            font-weight: 500;
            margin-top: 0.4rem;
            font-size: 1rem;
            opacity: 0.85;
        }

        /* Campos */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
        }

        label {
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--black);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        label .emoji {
            font-size: 1.1rem;
        }

        input {
            padding: 0.9rem 1.2rem;
            border-radius: 16px;
            border: 2px solid rgba(30, 30, 30, 0.15);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition);
            outline: none;
            color: var(--black);
            font-weight: 500;
        }

        input:focus {
            border-color: var(--orange);
            box-shadow: 0 0 0 4px rgba(245, 124, 0, 0.2);
            background: rgba(255, 255, 255, 0.9);
        }

        /* Link esqueci senha */
        .forgot-link {
            text-align: right;
            margin-top: -0.8rem;
            margin-bottom: 1.5rem;
        }

        .forgot-link a {
            color: var(--black);
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .forgot-link a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        /* Botão */
        .btn-submit {
            background: var(--orange);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 10px 25px rgba(245, 124, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            text-decoration: none;
        }

        .btn-submit:hover {
            background: var(--orange-dark);
            transform: translateY(-3px);
            box-shadow: 0 18px 35px rgba(245, 124, 0, 0.65);
        }

        /* Links auxiliares */
        .extra-links {
            text-align: center;
            margin-top: 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .link-helper {
            color: var(--black);
            font-weight: 700;
            text-decoration: none;
            font-size: 0.95rem;
            backdrop-filter: blur(4px);
            background: rgba(255,255,255,0.3);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            display: inline-block;
            transition: background 0.2s, color 0.2s;
        }

        .link-helper:hover {
            background: rgba(255,255,255,0.6);
            color: var(--orange-dark);
        }

        /* Responsivo */
        @media (max-width: 500px) {
            .login-card {
                padding: 2rem 1.3rem;
                border-radius: 2rem;
            }
            .brand-name {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <!-- Fundo -->
    <div class="bg-image"></div>
    <div class="overlay"></div>

    <!-- Cartão de login -->
    <div class="login-card">
        <div class="form-header">
            <div class="brand-row">
                <div class="logo-placeholder" title="Logo da academia">🏋️</div>
                <div class="brand-name">NOME DA ACADEMIA</div>
            </div>
            <h1 class="title">Entrar na conta</h1>
            <p class="subtitle">Acesse seu espaço de treinos e evolução</p>
        </div>

        <form action="dashboard.html" method="post">
            <!-- Email -->
            <div class="input-group">
                <label><span class="emoji">📧</span> E-mail (Gmail)</label>
                <input type="email" name="email" placeholder="exemplo@gmail.com" required>
            </div>

            <!-- Senha -->
            <div class="input-group">
                <label><span class="emoji">🔒</span> Senha</label>
                <input type="password" name="senha" placeholder="••••••••" required>
            </div>

            <!-- Esqueci senha -->
            <div class="forgot-link">
                <a href="#">Esqueci minha senha</a>
            </div>

            <!-- Botão -->
            <button type="submit" class="btn-submit">
                🔐 Entrar
            </button>
        </form>

        <!-- Links extras -->
        <div class="extra-links">
            <a href="10.html" class="link-helper">✨ Criar uma conta</a>
            <a href="index.html" class="link-helper">← Voltar para a página inicial</a>
        </div>
    </div>
</body>
</html>
